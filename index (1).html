<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff3f6c"><title>Trendora — Online Fashion Shopping</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff3f6c'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'%3ET%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#f5f5f6;--card:#fff;--text:#282c3f;--muted:#7e818c;--line:#eaeaec;--soft:#f5f5f6;
  --brand:#ff3f6c;--brand-d:#e7325c;--ink:#1d1f2c;--ok:#03a685;--rate:#14958f;--warn:#ff905a;--danger:#f16565;--blue:#526cd0;
  --r:6px;--shadow:0 2px 16px rgba(40,44,63,.08);--shadow2:0 10px 40px rgba(40,44,63,.16);
}
body.dark{--bg:#0f1016;--card:#181a23;--text:#e8e9ee;--muted:#9a9cab;--line:#2a2c38;--soft:#20222d;--ink:#e8e9ee}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Assistant","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;color:var(--text);font-size:14px}
a{color:inherit;text-decoration:none;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
@media(max-width:700px){.wrap{padding:0 12px}}

/* ---------- HEADER ---------- */
.hdr{position:sticky;top:0;z-index:50;background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.hdr .wrap{display:flex;align-items:center;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.logo .mk{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#ff3f6c,#ff7a45);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;letter-spacing:-1px}
.logo b{font-size:21px;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
.logo small{display:block;font-size:9px;letter-spacing:1.6px;color:var(--muted);font-weight:700;margin-top:-3px}
.nav{display:flex;gap:4px;height:100%}
.nav a{display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:13px;letter-spacing:.3px;text-transform:uppercase;border-bottom:4px solid transparent;height:100%;color:var(--text)}
.nav a:hover,.nav a.on{border-color:var(--brand)}
.nav a .lv{background:var(--brand);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:5px}
.search{flex:1;position:relative;max-width:520px}
.search input{width:100%;height:42px;padding:0 14px 0 44px;border-radius:6px;border:1px solid transparent;background:var(--soft);outline:none;transition:.15s}
.search input:focus{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
.search>svg{position:absolute;left:14px;top:11px;color:var(--muted)}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border-radius:8px;box-shadow:var(--shadow2);overflow:hidden;display:none;z-index:60;border:1px solid var(--line)}
.sugg .s{padding:10px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.sugg .s:hover{background:var(--soft)}
.sugg img{width:36px;height:45px;object-fit:cover;border-radius:4px}
.hacts{display:flex;gap:20px;margin-left:auto;align-items:center}
.hact{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;position:relative;cursor:pointer}
.hact:hover{color:var(--brand)}
.cnt{position:absolute;top:-6px;right:-2px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:none;place-items:center;padding:0 4px;border:2px solid var(--card)}
.msearch{display:none;padding:0 12px 10px}
@media(max-width:1000px){.nav{display:none}}
@media(max-width:700px){
  .hdr .wrap{height:56px;gap:10px}.search.d{display:none}.msearch{display:block}.msearch .search{max-width:none}
  .hact span.l{display:none}.hacts{gap:16px}.hide-m{display:none!important}.logo small{display:none}
}
@media(min-width:701px){.show-m{display:none!important}}

/* ---------- COMMON ---------- */
.page{padding:20px 0 40px;animation:fi .25s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;margin:34px 0 14px;gap:10px}
.sec-h h2{font-size:20px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;color:var(--ink)}
.sec-h p{color:var(--muted);font-size:13px;margin-top:2px}
.sec-h a{color:var(--brand);font-weight:700;font-size:13px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.btn{height:46px;padding:0 22px;border-radius:4px;font-weight:700;font-size:14px;letter-spacing:.4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;text-transform:uppercase;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.btn.ink{background:var(--ink);color:var(--card)}
.btn.out{border:1px solid #d4d5d9;background:var(--card)}.btn.out:hover{border-color:var(--text)}
.btn.ghost{color:var(--brand);padding:0 8px;height:auto}
.btn.sm{height:34px;padding:0 14px;font-size:12px}
.btn.w{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.hs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-bottom:2px}
.hs::-webkit-scrollbar{display:none}.hs>*{scroll-snap-align:start;flex-shrink:0}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid #d4d5d9;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;background:var(--card)}
.chip.on{border-color:var(--brand);color:var(--brand);background:rgba(255,63,108,.05)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px}
.inp{width:100%;height:44px;padding:0 14px;border-radius:4px;border:1px solid #d4d5d9;background:var(--card);outline:none;transition:.15s}
textarea.inp{height:auto;padding:12px 14px;resize:vertical;min-height:90px}
.inp:focus{border-color:var(--text)}
.fl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;display:block;text-transform:uppercase;letter-spacing:.4px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumb a:hover{color:var(--text)}.crumb b{color:var(--text);font-weight:700}
.divider{height:1px;background:var(--line);margin:18px 0}
.muted{color:var(--muted)}.ok{color:var(--ok)}.b{font-weight:700}
.empty{text-align:center;padding:70px 20px}
.empty .ei{width:88px;height:88px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 18px;color:var(--muted)}
.empty .ei svg{width:40px;height:40px}
.empty h3{font-size:18px;margin-bottom:6px}.empty p{color:var(--muted);margin-bottom:20px}

/* ---------- HOME ---------- */
.cats{display:flex;justify-content:space-between;gap:14px;padding:18px 0 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.catc{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-width:84px}
.catc .im{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);transition:.2s}
.catc img{width:100%;height:100%;object-fit:cover;object-position:top}
.catc:hover .im{box-shadow:0 0 0 2px var(--brand)}
.catc span{font-size:13px;font-weight:700}
@media(max-width:700px){.catc{min-width:66px}.catc .im{width:64px;height:64px}.catc span{font-size:11.5px}}

.hero{position:relative;border-radius:8px;overflow:hidden;margin-top:16px;height:360px}
.slide{position:absolute;inset:0;display:flex;align-items:center;opacity:0;transition:opacity .7s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .txt{position:relative;z-index:2;padding:0 56px;max-width:560px;color:#fff}
.slide .eb{font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;opacity:.85}
.slide h1{font-size:46px;line-height:1.02;font-weight:800;letter-spacing:-1.2px;margin:10px 0 12px}
.slide p{font-size:15px;opacity:.85;margin-bottom:22px;max-width:420px}
.slide .pics{position:absolute;right:0;top:0;bottom:0;width:52%;display:flex;gap:0}
.slide .pics img{height:100%;flex:1;object-fit:cover;object-position:top;min-width:0}
.slide .pics::before{content:"";position:absolute;inset:0;z-index:1}
.slide .btn{background:#fff;color:#111}
.hdots{position:absolute;bottom:16px;left:56px;display:flex;gap:6px;z-index:5}
.hdots span{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.4);cursor:pointer;transition:.3s}
.hdots span.on{width:26px;background:#fff}
.harr{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#111;box-shadow:var(--shadow)}
@media(max-width:700px){.hero{height:230px;margin-top:10px}.slide .txt{padding:0 18px;max-width:62%}.slide h1{font-size:23px;letter-spacing:-.5px;margin:6px 0}.slide p{display:none}.slide .pics{width:48%}.slide .eb{font-size:9.5px;letter-spacing:1.5px}.hdots{left:18px}.harr{display:none}.slide .btn{height:36px;font-size:11px;padding:0 14px}}

.trust{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px}
.trust>div{display:flex;align-items:center;gap:12px;padding:16px 18px;border-right:1px solid var(--line)}
.trust>div:last-child{border:none}
.trust .ti{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--brand);flex-shrink:0}
.trust b{font-size:13.5px;display:block}.trust small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.trust{grid-template-columns:1fr 1fr}.trust>div{border-bottom:1px solid var(--line);padding:12px}.trust>div:nth-child(2n){border-right:none}}

.deal{padding:18px 20px}
.deal .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.deal h2{font-size:20px;font-weight:800;text-transform:uppercase}
.timer{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.timer span{background:var(--ink);color:var(--card);padding:5px 7px;border-radius:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.deal .hs>.pc{width:200px}
@media(max-width:700px){.deal{padding:14px 12px}.deal .hs>.pc{width:150px}}

.exc{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:1000px){.exc{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.exc{grid-template-columns:1fr 1fr}.exc>div:first-child{grid-column:span 2}}
.exc>div{padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;border:1px solid var(--line)}
.exc>div:hover{box-shadow:var(--shadow2);transform:translateY(-2px)}
.exc .xi{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
.exc b{font-size:15px;display:block;margin-bottom:3px}
.exc small{color:var(--muted);font-size:12.5px;display:block;line-height:1.35}
.exc .go{position:absolute;right:14px;top:18px;color:var(--muted)}
.exc .nw{position:absolute;right:12px;bottom:12px;font-size:10px;font-weight:800;color:var(--brand);letter-spacing:.8px}

.edit{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px}
.edit>div{border-radius:8px;overflow:hidden;position:relative;cursor:pointer;aspect-ratio:4/5}
.edit>div:first-child{aspect-ratio:auto;background:linear-gradient(160deg,#3b0a1e,#7a1738);color:#fff;padding:30px;display:flex;flex-direction:column;justify-content:flex-end}
.edit img{width:100%;height:100%;object-fit:cover;transition:.5s}
.edit>div:hover img{transform:scale(1.04)}
.edit .lbl{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.edit .lbl b{font-size:16px;display:block}.edit .lbl small{opacity:.85}
@media(max-width:700px){.edit{grid-template-columns:1fr 1fr}.edit>div:first-child{grid-column:span 2;padding:22px;min-height:180px}}

.brands{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:900px){.brands{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.brands{grid-template-columns:1fr 1fr}}
.brands>div{border-radius:8px;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);transition:.2s}
.brands>div:hover{box-shadow:var(--shadow2)}
.brands .bi{aspect-ratio:1/1;overflow:hidden}
.brands img{width:100%;height:100%;object-fit:cover;object-position:top}
.brands .bt{padding:10px 12px;text-align:center}
.brands .bt b{display:block;font-size:14px}.brands .bt span{font-size:13px;color:var(--brand);font-weight:700}

/* ---------- PRODUCT CARD ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px 14px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr;gap:4px}}
.pc{background:var(--card);cursor:pointer;position:relative;transition:box-shadow .2s;border-radius:4px;overflow:hidden}
.pc:hover{box-shadow:0 4px 18px rgba(40,44,63,.14)}
.pc .pim{position:relative;aspect-ratio:4/5;background:var(--soft);overflow:hidden}
.pc .pim img{width:100%;height:100%;object-fit:cover;transition:opacity .4s,transform .6s}
.pc .pim img.alt{position:absolute;inset:0;opacity:0}
.pc:hover .pim img.alt{opacity:1}
.pc .rt{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);color:#282c3f;font-size:12px;font-weight:700;padding:2px 6px;border-radius:2px;display:flex;align-items:center;gap:3px}
.pc .rt svg{width:11px;height:11px;fill:var(--rate);stroke:none}
.pc .rt i{font-style:normal;color:#aaa;font-weight:400;margin:0 1px}
.pc .wl{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#282c3f;z-index:2;transition:.15s}
.pc .wl:hover{transform:scale(1.08)}
.pc .wl.on{color:var(--brand)}.pc .wl.on svg{fill:var(--brand)}
.pc .badge{position:absolute;left:0;top:10px;background:var(--ink);color:var(--card);font-size:10px;font-weight:800;padding:3px 8px;letter-spacing:.5px;z-index:2}
.pc .badge.hot{background:var(--brand);color:#fff}
.pc .pi{padding:10px 10px 12px}
.pc .br{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .nm{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:14px}
.price b{font-weight:800;color:var(--ink)}
.price s{color:var(--muted);font-size:12px}
.price em{color:var(--warn);font-weight:700;font-style:normal;font-size:12px}
.pc .tb{margin-top:6px;font-size:12px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:4px}
.pc .tb svg{width:14px;height:14px}
.pc .qa{position:absolute;left:8px;right:8px;bottom:8px;opacity:0;transform:translateY(8px);transition:.2s;z-index:2}
.pc:hover .qa{opacity:1;transform:none}
.pc:hover .rt{opacity:0}
@media(max-width:700px){.pc .qa{display:none}.pc:hover .rt{opacity:1}.pc .br{font-size:13.5px}.pc .nm{font-size:12px}.price{font-size:13px}}
.stock{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.stock i{display:block;height:100%;background:var(--brand)}
.stockt{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}

/* ---------- LISTING ---------- */
.lst{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.lst{grid-template-columns:1fr}.fside{display:none}}
.fside{padding:0;position:sticky;top:90px}
.fside .fh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:800;font-size:15px;text-transform:uppercase}
.fside .fh a{color:var(--brand);font-size:12px}
.fgrp{padding:14px 18px;border-bottom:1px solid var(--line)}
.fgrp h4{font-size:13px;font-weight:800;text-transform:uppercase;margin-bottom:10px;letter-spacing:.3px}
.fgrp label{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:14px}
.fgrp label small{color:var(--muted)}
.fgrp input{width:16px;height:16px;accent-color:var(--brand)}
.lbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.lbar select{height:40px;border:1px solid var(--line);border-radius:4px;padding:0 12px;background:var(--card);font-weight:600;outline:none}
.mfbar{display:none;position:sticky;top:106px;z-index:20;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -12px 10px}
.mfbar button{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-transform:uppercase;font-size:13px}
.mfbar button+button{border-left:1px solid var(--line)}
@media(max-width:900px){.mfbar{display:flex}.lbar select{display:none}}

/* ---------- PDP ---------- */
.pdp{display:grid;grid-template-columns:1.3fr 1fr;gap:34px;align-items:start}
@media(max-width:900px){.pdp{grid-template-columns:1fr;gap:0}}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal div{aspect-ratio:4/5;overflow:hidden;border-radius:4px;cursor:zoom-in;background:var(--soft)}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal div:hover img{transform:scale(1.08)}
@media(max-width:900px){.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin:0 -12px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gal div{min-width:100%;scroll-snap-align:start;border-radius:0}}
.gdots{display:none;justify-content:center;gap:6px;margin:10px 0}
.gdots span{width:6px;height:6px;border-radius:3px;background:#d4d5d9}.gdots span.on{background:var(--brand);width:18px}
@media(max-width:900px){.gdots{display:flex}}
.pdi{}
@media(min-width:901px){.pdp>div:first-child{position:sticky;top:92px}}
@media(max-width:900px){.pdi{position:static;padding-top:6px}}
.pdi .br{font-size:24px;font-weight:800;color:var(--ink)}
.pdi h1{font-size:19px;font-weight:400;color:var(--muted);margin:4px 0 12px;line-height:1.3}
.rbox{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:4px 10px;border-radius:3px;font-weight:700;font-size:14px;cursor:pointer}
.rbox svg{width:14px;height:14px;fill:var(--rate);stroke:none}
.rbox span{color:var(--muted);font-weight:400;border-left:1px solid var(--line);padding-left:8px}
.pprice{display:flex;align-items:baseline;gap:12px;margin:4px 0 4px;flex-wrap:wrap}
.pprice b{font-size:26px;font-weight:800;color:var(--ink)}
.pprice s{font-size:18px;color:var(--muted)}
.pprice em{font-size:18px;color:var(--warn);font-weight:700;font-style:normal}
.tax{color:var(--ok);font-weight:700;font-size:13px}
.lblr{display:flex;align-items:center;gap:20px;margin:22px 0 12px;font-weight:800;font-size:15px;text-transform:uppercase}
.lblr a{color:var(--brand);font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;text-transform:uppercase}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.sizes button{min-width:50px;height:50px;border-radius:25px;border:1px solid #bfc0c6;font-weight:700;background:var(--card);padding:0 12px;transition:.15s}
.sizes button:hover{border-color:var(--brand)}
.sizes button.on{border-color:var(--brand);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.sizes button.oos{color:#bfc0c6;border-color:var(--line);text-decoration:line-through;pointer-events:none}
.sizes-note{font-size:12.5px;color:var(--warn);font-weight:700;margin-top:10px}

.lrow .th img{width:100%;height:100%;object-fit:cover}
.lrow .th .lbadge{position:absolute;top:4px;left:4px;font-size:8px;padding:1px 4px;color:#fff}
.reels{position:fixed;inset:0;z-index:90;background:#000;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100vh;height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff;max-width:480px;margin:0 auto}
.reel>img{width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 20%,transparent 55%,rgba(0,0,0,.75));pointer-events:none}
.reel .side{position:absolute;right:12px;bottom:150px;display:flex;flex-direction:column;gap:18px;z-index:3}
.reel .side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#fff}
.reel .side svg{width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.reel .side .liked svg{fill:#ff3f6c;stroke:#ff3f6c}
.reel .info{position:absolute;left:14px;right:70px;bottom:96px;z-index:3;font-size:14px}
.reel .cr{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.reel .cr .a{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff3f6c,#ff7a45);display:grid;place-items:center;border:1.5px solid #fff;font-size:13px}
.reel .cr button{border:1px solid #fff;border-radius:4px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff}
.reel .shop{position:absolute;left:12px;right:12px;bottom:18px;background:rgba(255,255,255,.96);color:#282c3f;border-radius:8px;padding:8px;display:flex;align-items:center;gap:10px;z-index:3}
.reel .shop img{width:46px;height:56px;object-fit:cover;border-radius:4px}
.reeltop{position:fixed;top:0;left:0;right:0;z-index:95;padding:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;max-width:480px;margin:0 auto}
.reeltop button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;position:relative}
.bigheart{position:absolute;left:50%;top:45%;z-index:5;animation:bh .9s ease forwards;pointer-events:none;color:#ff3f6c}
.bigheart svg{width:110px;height:110px;fill:currentColor;stroke:none}
@keyframes bh{0%{transform:translate(-50%,-50%) scale(0);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.ai-mini{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.ai-mini>div{min-width:104px;max-width:104px;background:var(--soft);border-radius:6px;overflow:hidden;cursor:pointer}
.ai-mini img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ai-mini p{font-size:11.5px;font-weight:700;padding:5px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-mini small{display:block;padding:0 6px 6px;font-size:11.5px;color:var(--brand);font-weight:800}

/* resell / profile */
.earn{background:linear-gradient(135deg,#03a685,#047a65);color:#fff;border-radius:8px;padding:24px;position:relative;overflow:hidden}
.earn h2{font-size:36px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stats>div{padding:14px;text-align:center}.stats b{display:block;font-size:20px}.stats small{color:var(--muted);font-size:12px;font-weight:600}
.rrow{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.rrow:last-child{border:none}
.rrow img{width:54px;height:68px;object-fit:cover;border-radius:4px}
.acc{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.acc{grid-template-columns:1fr}}
.ucard{padding:22px;display:flex;align-items:center;gap:14px}
.ucard .av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ff3f6c,#ff7a45);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}
.mlist a{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
.mlist a:last-child{border:none}.mlist a:hover{background:var(--soft)}
.mlist a .r{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.tiles{grid-template-columns:1fr 1fr}}
.tiles>div{padding:20px;text-align:center;cursor:pointer;border:1px solid var(--line);transition:.15s}
.tiles>div:hover{border-color:var(--brand)}
.tiles svg{width:30px;height:30px;color:var(--muted);margin-bottom:8px}
.tiles b{display:block;font-size:14px}.tiles small{color:var(--muted);font-size:12px}
.wheel{width:260px;height:260px;margin:10px auto 20px;position:relative}
.wheel svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.15,.8,.2,1)}
.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--ink);z-index:2}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:12px;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}

@media(max-width:700px){.og{grid-template-columns:1fr!important}}
body.nobnav .bnav{display:none!important}
@media(max-width:700px){body.nobnav{padding-bottom:0}}

// Demo timeline: stages advance with time since order (accelerated for demo)
const STAGES=['Ordered','Packed','Shipped','Out for Delivery','Delivered'];
const STAGE_MIN=[0,2,5,10,20]; // minutes after placing (demo)
const OrderAPI={
  stage(o){if(o.status==='cancelled')return -1;if(o.forceStage!=null)return o.forceStage;const m=(Date.now()-o.date)/60000;let s=0;STAGE_MIN.forEach((v,i)=>{if(m>=v)s=i});return s},
  label(o){const s=this.stage(o);if(s<0)return 'Cancelled';if(o.ret)return o.ret.type==='exchange'?'Exchange '+o.ret.status:'Return '+o.ret.status;return STAGES[s]},
  canCancel(o){return this.stage(o)>=0&&this.stage(o)<2},
  canReturn(o){return this.stage(o)===4&&!o.ret},
  eta(o){return o.date+3*864e5},
  cancel(id,reason){const o=S.orders.find(x=>x.id===id);if(!o||!this.canCancel(o))return false;o.status='cancelled';o.cancelReason=reason;o.cancelledAt=Date.now();
    if(o.pay!=='cod')o.refund={amt:o.amt,status:'Initiated',t:Date.now(),to:o.pay==='upi'?'Original UPI account':'Original payment method'};save();return true},
  requestReturn(id,type,reason,size){const o=S.orders.find(x=>x.id===id);if(!o||!this.canReturn(o))return false;
    o.ret={type,reason,size,status:'Pickup Scheduled',t:Date.now(),pickup:Date.now()+864e5};
    if(type==='return')o.refund={amt:o.amt,status:'Will initiate after pickup',t:Date.now(),to:o.pay==='cod'?'Trendora Wallet / Bank':'Original payment method'};save();return true},
};

/* ---------------- SUPPORT API ----------------
   TODO(backend): Replace each method body with a fetch() call, e.g.
     listTickets   -> GET    /api/support/tickets
     getTicket     -> GET    /api/support/tickets/:id
     createTicket  -> POST   /api/support/tickets
     addMessage    -> POST   /api/support/tickets/:id/messages

     requestCallback -> POST /api/support/callbacks
   Live chat can move to WebSocket / Socket.io: onAgentMessage(cb)
--------------------------------------------------*/
const wait=(ms=250)=>new Promise(r=>setTimeout(r,ms));
const SupportAPI={
  async listTickets(){await wait(80);return [...S.tickets].sort((a,b)=>b.updated-a.updated)},
  async getTicket(id){await wait(60);return S.tickets.find(t=>t.id===id)},
  async createTicket({subject,cat,orderId,text,priority='Medium',msgs}){await wait(300);
    const t={id:'TKT-'+(10000+Math.floor(Math.random()*89999)),subject,cat,orderId:orderId||null,status:'Open',priority,created:Date.now(),updated:Date.now(),
      msgs:msgs||[{from:'user',text,t:Date.now()}]};
    t.msgs.push({from:'system',text:`Ticket ${t.id} created. Expected response within 2 hours.`,t:Date.now()});
    S.tickets.unshift(t);save();this._autoAck(t.id);return t},
  async addMessage(id,msg){await wait(120);const t=S.tickets.find(x=>x.id===id);if(!t)return;
    t.msgs.push({...msg,t:Date.now()});t.updated=Date.now();
    if(msg.from==='user'){if(t.status==='Resolved'||t.status==='Closed')t.msgs.push({from:'system',text:'Ticket reopened',t:Date.now()});t.status='Open';this._autoReply(id,msg.text)}
    if(msg.from==='agent'&&t.status==='Open')t.status='In Progress';
    save();return t},
  async setStatus(id,status){const t=S.tickets.find(x=>x.id===id);if(!t)return;t.status=status;t.updated=Date.now();t.msgs.push({from:'system',text:'Status changed to '+status,t:Date.now()});save();return t},
  async rate(id,n){const t=S.tickets.find(x=>x.id===id);if(t){t.csat=n;save()}},
  async requestCallback(data){await wait(300);const t=await this.createTicket({subject:'Callback request: '+data.topic,cat:'Callback',text:`Please call me on ${data.phone} (${data.slot}). Topic: ${data.topic}`,priority:'High'});return t},
  // --- DEMO ONLY: simulated agent. Remove when real helpdesk is connected ---
  _autoAck(id){setTimeout(()=>{const t=S.tickets.find(x=>x.id===id);if(!t||t.msgs.some(m=>m.from==='agent'))return;
    t.msgs.push({from:'agent',name:'Neha',text:`Hi ${S.user.name}, I'm Neha from Trendora Support. I've picked up your request "${t.subject}" and I'm looking into it right away.`,t:Date.now()});t.status='In Progress';t.updated=Date.now();save();refreshSupportViews(id)},5000)},
  _autoReply(id,text){setTimeout(()=>{const t=S.tickets.find(x=>x.id===id);if(!t)return;
    t.msgs.push({from:'agent',name:'Neha',text:agentBrain(text,t),t:Date.now()});t.status='Awaiting Customer';t.updated=Date.now();save();refreshSupportViews(id)},3500)},
};
function agentBrain(q,t){
  q=q.toLowerCase();
  if(/refund|paisa|money|amount/.test(q))return 'I have checked with our payments team. Refunds are processed within 24 hours of pickup and reflect in 3–5 working days (UPI: 24–48 hrs). I have marked your case as priority.';
  if(/late|delay|kab|when|where|kaha/.test(q))return 'Apologies for the wait! Your shipment is with our delivery partner and will reach you within 24–48 hours. I have escalated it to the courier hub as well.';
  if(/size|fit|chhota|bada|small|big|large/.test(q))return 'No worries — you can exchange for a different size for free within 15 days. I can schedule a pickup for you; which size would you like?';
  if(/damage|defect|torn|broken|kharab|wrong/.test(q))return 'I am really sorry about this. Please share a photo of the product using the attach button. We will arrange a free replacement or full refund — your choice.';
  if(/thank|thanks|ok|okay|done|shukriya/.test(q))return 'Happy to help! Is there anything else I can do for you? If not, I will mark this ticket as resolved.';
  return 'Thanks for the details. I am checking this with the concerned team and will update you here shortly. You will also get an SMS/email update.';
}

  let mrp=0,sub=0;S.cart.forEach(c=>{const p=byId(c.id);mrp+=p.mrp*c.q;sub+=(c.group?p.group:p.price)*c.q});

  const coin=useCoins?Math.min(S.coins,Math.round((sub-cd)*.1)):0;const fee=sub?19:0;const ship=sub-cd>=499||!sub?0:49;

function aiAsk(q){q=(q||'').trim();if(!q)return;document.getElementById('aiq').value='';const c=document.getElementById('aichat');

function aiReply(q){
  const s=q.toLowerCase();const num=(s.match(/(\d[\d,]{2,})/)||[])[1];const budget=num?+num.replace(/,/g,''):Infinity;
  const occ=[['wedding',['wedding','shaadi','shadi','bridal','sangeet']],['festive',['diwali','festive','festival','puja','eid','navratri']],['party',['party','night','club','date','birthday']],['office',['office','work','formal','interview']],['gym',['gym','workout','sports','running']],['winter',['winter','cold','sardi','thand']],['casual',['college','casual','daily','travel','weekend']],['gift',['gift','present']]].find(o=>o[1].some(w=>s.includes(w)));
  const gen=/\b(girl|girls|women|woman|her|ladki|female|wife|mom|sister)\b/.test(s)?'f':/\b(boy|boys|men|man|him|ladka|male|husband|dad|brother)\b/.test(s)?'m':null;
  if(/^(hi|hello|hey|namaste)\b/.test(s)&&s.length<14)return 'Hello! Which occasion are you shopping for — wedding, party, office, winter or casual?';

  if(gen)list=list.filter(p=>p.g===gen||p.g==='u');

async function toAgent(topic='General query',orderId){

  const c=document.getElementById('chat');c.insertAdjacentHTML('beforeend','<div class="cm sys" id="queue">Connecting you to an agent… You are #2 in queue</div>');c.scrollTop=1e6;
  const transcript=chatLog.filter(h=>h.includes('cm user')).slice(-6).map(h=>({from:'user',text:h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').replace(/\d{1,2}:\d{2}\s?(am|pm)?\s*$/i,'').trim(),t:Date.now()}));
  const t=await SupportAPI.createTicket({subject:'Live chat — '+topic,cat:'Live Chat',orderId,msgs:transcript.length?transcript:[{from:'user',text:topic,t:Date.now()}]});chatTicket=t.id;
  t.msgs.find(m=>m.from==='agent')||(t._chat=1);

    const tk=S.tickets.find(x=>x.id===t.id);tk.msgs.push({from:'agent',name:'Neha',text:msg,t:Date.now(),_shown:1});tk.status='In Progress';save();chatAdd('agent',esc(msg),'Neha')},3200);

async function chatSend(){
  const i=document.getElementById('ci');const v=i.value.trim();if(!v)return;i.value='';chatUser(v);
  if(chatMode==='agent'&&chatTicket){await SupportAPI.addMessage(chatTicket,{from:'user',text:v});
    const c=document.getElementById('chat');c.insertAdjacentHTML('beforeend','<div class="cm agent typing" id="ctyp"><span></span><span></span><span></span></div>');c.scrollTop=1e6;setTimeout(()=>document.getElementById('ctyp')?.remove(),3400);return}
  // intent detection (Hindi + English)
  const s=v.toLowerCase();
  if(/track|where|kaha|kab|status|deliver/.test(s))return orderPicker('fTrack');
  if(/cancel|radd/.test(s))return orderPicker('fCancel');
  if(/return|exchange|size|badal|wapas/.test(s))return orderPicker('fReturn');
  if(/refund|paisa|money back/.test(s))return startFlow('refund',true);
  if(/payment|pay|upi|card|deduct|kat/.test(s))return startFlow('payment',true);
  if(/agent|human|person|call|baat|executive/.test(s))return toAgent('Customer request');
  if(/damage|defect|wrong|kharab|torn/.test(s))return orderPicker('fDamage');
  if(/thank|thanks|shukriya|bye/.test(s))return botSay('You\'re welcome! Anything else I can help with?',[['Main menu','mainMenu()'],['No, end chat','endChat()']]);
  botSay('I\'m not sure I understood that. Please choose an option below, or talk to one of our support agents.',[['Main menu','mainMenu()'],['Talk to an agent',`toAgent('${esc(v).slice(0,40).replace(/'/g,'')}')`]]);
}
